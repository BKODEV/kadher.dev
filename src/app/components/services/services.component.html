<!-- ============================================================
     Section « Ce que je fais » (03)
     5 cartes d'offres. L'icône est sélectionnée via @switch sur
     le champ `s.icon` (voir le type ServiceIcon dans le TS).
     ============================================================ -->
<section class="section" id="services">
  <div class="section-head" appReveal>
    <span class="section-num">03 ——</span>
    <h2>Ce que je fais</h2>
    <div class="rule"></div>
  </div>

  <div class="services-grid">
    @for (s of services; let i = $index; track s.title) {
      <article class="service-card" appReveal>
        <div class="service-head">
          <span class="service-icon" aria-hidden="true">
            @switch (s.icon) {
              @case ('code') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 18 22 12 16 6" />
                  <polyline points="8 6 2 12 8 18" />
                </svg>
              }
              @case ('mail') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="M3 7l9 6 9-6" />
                </svg>
              }
              @case ('server') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="6" rx="2" />
                  <rect x="2" y="15" width="20" height="6" rx="2" />
                  <line x1="6" y1="6" x2="6.01" y2="6" />
                  <line x1="6" y1="18" x2="6.01" y2="18" />
                </svg>
              }
              @case ('compass') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10" />
                  <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
                </svg>
              }
              @case ('link') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.71" />
                </svg>
              }
            }
          </span>
          <span class="service-num">{{ '0' + (i + 1) }}</span>
        </div>
        <h3>{{ s.title }}</h3>
        <p>{{ s.desc }}</p>
      </article>
    }
  </div>
</section>
